<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget VIP / Tap Taps</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .vip-widget {
      position: fixed;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);

      width: 520px;
      min-height: 105px;
      padding: 18px 22px;
      border-radius: 28px;

      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), transparent 42%),
        linear-gradient(180deg, rgba(255, 238, 246, 0.92), rgba(255, 218, 234, 0.86));

      border: 2px solid rgba(255, 211, 226, 0.92);

      box-shadow:
        0 12px 28px rgba(130, 38, 78, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      color: #6b2944;
      text-align: center;
      opacity: 0;
      transform-origin: center;

      transition:
        opacity 0.35s ease,
        transform 0.35s cubic-bezier(.2, .9, .2, 1);

      pointer-events: none;
      overflow: hidden;
    }

    .vip-widget.show {
      opacity: 1;
      transform: translateX(-50%) translateY(40px) scale(0.82);
    }

    .vip-widget::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.55) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255, 157, 195, 0.28) 0 2px, transparent 3px);
      background-size: 38px 38px, 54px 54px;
      animation: sparkleDrift 8s linear infinite;
      opacity: 0.55;
      pointer-events: none;
    }

    .vip-content {
      position: relative;
      z-index: 2;
    }

    .vip-kicker {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #9a4263;
      margin-bottom: 8px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    .vip-main {
      font-size: 28px;
      line-height: 1.12;
      font-weight: 950;
      color: #5f2340;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.86),
        0 2px 8px rgba(129, 36, 75, 0.14);
    }

    .vip-main strong {
      color: #b03368;
    }

    .vip-sub {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 850;
      color: #7e3b55;
    }

    .celebration {
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.98), transparent 44%),
        linear-gradient(180deg, rgba(255, 241, 225, 0.94), rgba(255, 216, 234, 0.9));
      border-color: rgba(255, 225, 178, 0.96);
      box-shadow:
        0 18px 44px rgba(154, 83, 27, 0.24),
        0 0 0 4px rgba(255, 236, 198, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
      animation: celebratePulse 1.1s ease-in-out infinite;
    }

    .celebration .vip-kicker { color: #9b6128; }
    .celebration .vip-main { color: #7a371f; }
    .celebration .vip-main strong { color: #c24674; }
    .celebration .vip-sub { color: #874a2c; }

    @keyframes sparkleDrift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(36px, 36px) rotate(8deg); }
    }

    @keyframes celebratePulse {
      0%, 100% {
        transform: translateX(-50%) translateY(40px) scale(0.82);
      }
      50% {
        transform: translateX(-50%) translateY(35px) scale(0.86);
      }
    }

    @media (max-width: 700px) {
      .vip-widget {
        width: 92vw;
      }

      .vip-main {
        font-size: 23px;
      }

      .vip-sub {
        font-size: 15px;
      }
    }

    .vip-widget.near {
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.98), transparent 44%),
          linear-gradient(180deg, rgba(255, 248, 216, 0.94), rgba(255, 226, 163, 0.9));
        border-color: rgba(255, 220, 140, 0.96);
      }

      .vip-widget.ultra {
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.98), transparent 44%),
          linear-gradient(180deg, rgba(255, 228, 220, 0.96), rgba(255, 150, 180, 0.92));
        border-color: rgba(255, 160, 190, 0.98);
        animation: celebratePulse 0.85s ease-in-out infinite;
      }

      .vip-widget.ultra .vip-kicker {
        color: #a3364e;
      }

      .vip-widget.ultra .vip-main {
        color: #7c1f3c;
      }
  </style>
</head>

<body>
  <div id="vipWidget" class="vip-widget">
    <div class="vip-content">
      <div id="vipKicker" class="vip-kicker">Título desbloqueado</div>
      <div id="vipMain" class="vip-main"></div>
      <div id="vipSub" class="vip-sub"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const socketUrl = params.get("socketUrl") || "http://127.0.0.1:3002";

    const META_MONEDAS = Number(params.get("meta") || 1500);
    const UMBRAL_CERCA = Number(params.get("umbral") || 300);

    const UMBRAL_ULTRA = Number(params.get("ultra") || 100);
    let visualMode = "normal";
    let visualPriority = 0;

    const DURACION_PROGRESO = Number(params.get("duracionProgreso") || 8500);
    const DURACION_LOGRO = Number(params.get("duracionLogro") || 7000);
    const DURACION_TAP = Number(params.get("duracionTap") || 7000);
    const MODO_ANONIMO = params.get("anonimo") === "1";

    const vipWidget = document.getElementById("vipWidget");
    const vipKicker = document.getElementById("vipKicker");
    const vipMain = document.getElementById("vipMain");
    const vipSub = document.getElementById("vipSub");

    let hideTimer = null;
let lastShownKey = "";
let lastShownAt = 0;

const rewardAlertCounts = {};
const MAX_REWARD_ALERTS = 2;

function canShowRewardAlert({ username, uniqueId, ciclo, monedas }, nivel) {
  const id = uniqueId || username || "usuario";
  const cicloSeguro = ciclo || Math.floor((Number(monedas || 0) - 1) / META_MONEDAS) + 1;
  const key = `${id}|${nivel}|ciclo:${cicloSeguro}`;

  rewardAlertCounts[key] = Number(rewardAlertCounts[key] || 0);

  if (rewardAlertCounts[key] >= MAX_REWARD_ALERTS) return false;

  rewardAlertCounts[key] += 1;
  return true;
}

    function safeName(value) {
      return String(value || "Alguien")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function getNombre(cliente) {
      if (MODO_ANONIMO) return "Alguien";

      return safeName(
        cliente?.username ||
        cliente?.nickname ||
        cliente?.uniqueId ||
        "Alguien"
      );
    }

    function getCicloVip(cliente) {
        const total = Number(cliente?.monedasAcumuladas || 0);

        const ciclo = total > 0
          ? Math.floor((total - 1) / META_MONEDAS) + 1
          : 1;

        const progreso = total > 0
          ? ((total - 1) % META_MONEDAS) + 1
          : 0;

        const faltan = progreso === 0
          ? META_MONEDAS
          : META_MONEDAS - progreso;

        return { total, ciclo, progreso, faltan };
      }

      function getFaltan(cliente) {
        return getCicloVip(cliente).faltan;
      }

    function puedeMostrar(cliente) {
        if (!cliente) return false;

        const data = getCicloVip(cliente);

        if (data.total <= 0) return false;

        return data.faltan > 0 && data.faltan <= UMBRAL_CERCA;
      }

    function getTextoProgreso(nombre, faltan) {
      if (MODO_ANONIMO) {
        return {
          kicker: faltan <= 50 ? "Está a nada" : "Recompensa cerca",
          main: `Alguien está a <strong>${faltan}</strong> monedas`,
          sub: faltan <= 50
            ? "de desbloquear su pregunta extensa GRATIS 💖"
            : "de desbloquear algo especial 👀"
        };
      }

      if (faltan <= 50) {
        return {
          kicker: "Está a nada",
          main: `${nombre} está a <strong>${faltan}</strong> monedas`,
          sub: "de su pregunta extensa GRATIS 💖"
        };
      }

      if (faltan <= 150) {
        return {
          kicker: "Muy cerca",
          main: `${nombre} está a <strong>${faltan}</strong> monedas`,
          sub: "de desbloquear su recompensa ✨"
        };
      }

      return {
        kicker: "Recompensa cerca",
        main: `${nombre} está a <strong>${faltan}</strong> monedas`,
        sub: "de su pregunta extensa GRATIS 💖"
      };
    }

    function getPriority(mode) {
      if (mode === "reward") return 4;
      if (mode === "ultra") return 3;
      if (mode === "near") return 2;
      if (mode === "tap") return 0;
      return 0;
    }
    function showCard({ kicker, main, sub, celebration = false, duration = 8000, mode = "tap" }) {
      const nextPriority = getPriority(mode);

      if (nextPriority < visualPriority) return;

      visualMode = mode;
      visualPriority = nextPriority;

      clearTimeout(hideTimer);

      vipWidget.classList.toggle("celebration", celebration);
      vipWidget.classList.toggle("ultra", mode === "ultra");
      vipWidget.classList.toggle("near", mode === "near");

      vipKicker.innerHTML = kicker;
      vipMain.innerHTML = main;
      vipSub.innerHTML = sub;

      vipWidget.classList.add("show");

      hideTimer = setTimeout(() => {
        vipWidget.classList.remove("show");
        vipWidget.classList.remove("celebration", "ultra", "near");
        visualMode = "normal";
        visualPriority = 0;
      }, duration);
    }

    function mostrarNear(data) {
      const nombre = MODO_ANONIMO ? "Alguien" : safeName(data?.username || "Alguien");
      const faltan = Number(data?.faltan || 0);

      showCard({
        kicker: "Recompensa cerca",
        main: `${nombre} está a <strong>${faltan}</strong> monedas`,
        sub: "de desbloquear su pregunta extensa GRATIS 💖",
        celebration: false,
        duration: DURACION_PROGRESO,
        mode: "near"
      });
    }

    function mostrarUltra(data) {
      const nombre = MODO_ANONIMO ? "Alguien" : safeName(data?.username || "Alguien");
      const faltan = Number(data?.faltan || 0);

      showCard({
        kicker: "Está a nada 🔥",
        main: `${nombre} está a solo <strong>${faltan}</strong> monedas`,
        sub: "¡casi desbloquea su pregunta extensa GRATIS!",
        celebration: true,
        duration: DURACION_PROGRESO,
        mode: "ultra"
      });
    }
    function mostrarProgreso(cliente) {
  const data = getCicloVip(cliente);
  const faltan = data.faltan;
  const nombre = getNombre(cliente);
  const key = `${cliente.id || cliente.uniqueId || cliente.username}|ciclo:${data.ciclo}|faltan:${faltan}|progreso:${data.progreso}`;
      
  const now = Date.now();

      if (key === lastShownKey && now - lastShownAt < 12000) return;

      lastShownKey = key;
      lastShownAt = now;

      const text = getTextoProgreso(nombre, faltan);
text.sub = `${text.sub} · Ciclo ${data.ciclo} · ${data.progreso}/${META_MONEDAS}`;


      showCard({
        ...text,
        celebration: false,
        duration: DURACION_PROGRESO
      });
    }

    function mostrarLogro(data) {
      const nombre = MODO_ANONIMO
        ? "Alguien"
        : safeName(data?.username || data?.nickname || "Alguien");

      showCard({
        kicker: "Recompensa desbloqueada",
        main: `🎉 ${nombre} lo logró`,
        sub: "su pregunta extensa GRATIS ya está lista 💖",
        celebration: true,
        duration: DURACION_LOGRO,
        mode: "reward"
      });
    }

    function mostrarRecompensaLive(data) {

      if (Date.now() - lastShownAt < 2000) return;
      
      const nombre = MODO_ANONIMO
        ? "Alguien"
        : safeName(data?.username || "Alguien");

      let titulo = "Recompensa desbloqueada";
      let sub = data?.mensaje || "Desbloqueó una recompensa";

      

      if (data?.tipo === "oraculo") {
        titulo = "🔮 Oráculo desbloqueado";
        sub = "ganó un mensaje del oráculo";
      }

      if (data?.tipo === "si_no") {
        titulo = "❓ Sí o No desbloqueado";
        sub = "ganó una pregunta Sí o No";
      }

      if (data?.tipo === "extensa") {
        titulo = "💎 Extensa desbloqueada";
        sub = "ganó una pregunta extensa GRATIS";
      }

      showCard({
        kicker: titulo,
        main: `${nombre} llegó a <strong>${Number(data?.progresoCiclo || data?.monedas || 0)}</strong> / ${META_MONEDAS}`,
        sub: data?.ciclo ? `${sub} · Ciclo ${data.ciclo}` : sub,
        celebration: true,
        duration: DURACION_LOGRO,
        mode: "reward"
      });
    }

    function mostrarTituloTap(data) {
      const nombre = MODO_ANONIMO
        ? "Alguien"
        : safeName(data?.username || data?.nickname || "Alguien");

      const titulo = safeName(data?.tituloTap || data?.cliente?.tituloTap || "Nuevo título");
      const totalTaps = Number(data?.totalTaps || data?.cliente?.totalTaps || 0);

      showCard({
        kicker: "Título de tap tap desbloqueado",
        main: `👆 ${nombre} ahora es`,
        sub: `${titulo} · ${totalTaps} tap taps`,
        celebration: true,
        duration: DURACION_TAP,
        mode: "tap"
      });
    }

    const socket = io(socketUrl, {
      transports: ["polling", "websocket"],
      reconnection: true
    });

    socket.on("connect", async () => {
      console.log("Widget conectado a:", socketUrl);

      try {
        const res = await fetch(`${socketUrl}/clientes-vip`);
        const clientes = await res.json();

        const candidatos = Array.isArray(clientes)
          ? clientes.filter(puedeMostrar).sort((a, b) => getFaltan(a) - getFaltan(b))
          : [];

        if (candidatos.length) {
          setTimeout(() => mostrarProgreso(candidatos[0]), 900);
        }
      } catch (error) {
        console.error("No se pudo cargar clientes-vip:", error);
      }
    });

    socket.on("clientesVip:update", (clientes) => {
      // Ya no mostramos progreso automático aquí.
      // Los avisos cerca / ultra ahora vienen controlados por el server:
      // reward:near y reward:ultra.
    });

    socket.on("vip:reward", (data) => {
      mostrarLogro(data);
    });

    socket.on("tap:title-unlocked", (data) => {
      mostrarTituloTap(data);
    });

    socket.on("reward:near", (data) => {
      if (!canShowRewardAlert(data, "near")) return;
      mostrarNear(data);
    });

    socket.on("reward:ultra", (data) => {
      if (!canShowRewardAlert(data, "ultra")) return;
      mostrarUltra(data);
    });

    socket.on("reward:unlocked", (data) => {
      mostrarLogro(data);
    });

    socket.on("reward:live", (data) => {
      mostrarRecompensaLive(data);
    });
  </script>
</body>
</html>
